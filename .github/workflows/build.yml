name: Build VocalFX APK

on:
  workflow_dispatch:
  push:
    branches: [ main, "github/workflows/build-apk.yml" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Perbaiki File XML Otomatis di Server
        run: |
          NS="http://android.com"
          RES="/apk/res/android"
          FULL_NS="${NS}${RES}"
          mkdir -p app/src/main/res/layout
          cat << EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="$FULL_NS">
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application
                  android:allowBackup="true"
                  android:label="VocalFX Pro Mixer"
                  android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".AudioCaptureService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
              </application>
          </manifest>
          EOF
          sed -i "s|xmlns:android=\"[^\"]*\"|xmlns:android=\"$FULL_NS\"|g" app/src/main/res/layout/activity_main.xml

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Rakit Menjadi APK
        run: gradle assembleDebug

      - name: Unggah File APK
        uses: actions/upload-artifact@v4
        with:
          name: VocalFX-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
